name: Publish BEZY support pages

on:
  push:
    branches:
      - codex/v1-localization
    paths:
      - app/docs/privacy-policy.html
      - app/docs/support.html
      - app/docs/index.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload support pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: app/docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
